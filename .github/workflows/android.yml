name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-apk:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/additions-together'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Assemble the unsigned integrated review APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v6
        with:
          name: integrated-review-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check shared action affordances
        run: python3 scripts/check_action_affordances.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check manager and transfer helper shell syntax
        run: |
          bash -n app/src/main/assets/manager.sh
          bash -n app/src/main/assets/progress.sh
          bash -n app/src/main/assets/archive-progress.sh
          bash -n app/src/main/assets/safe-backup.sh
          bash -n app/src/main/assets/install-validation.sh
          bash -n app/src/main/assets/transaction-recovery.sh
          bash -n app/src/main/assets/safety-inventory.sh
          bash -n app/src/main/assets/storage-usage.sh
          bash -n app/src/main/assets/backup-catalog.sh
          bash -n app/src/main/assets/extensions-helper.sh
          bash -n app/src/main/assets/extension-manager.sh
          bash -n app/src/main/assets/lan-security.sh
          bash -n app/src/main/assets/selective-restore.sh
          bash -n app/src/main/assets/selective-restore-data.sh
          bash -n app/src/main/assets/version-state.sh
          bash -n app/src/main/assets/version-manager.sh

      - name: Test LAN configuration and isolated extension changes
        run: |
          npm install --prefix "$RUNNER_TEMP/st-lan-yaml" --ignore-scripts --no-package-lock --no-audit --no-fund yaml@2.9.1
          # Fixture SillyTavern installs in the backup tests reuse the same YAML dependency.
          echo "NODE_PATH=$RUNNER_TEMP/st-lan-yaml/node_modules" >> "$GITHUB_ENV"
          ST_TEST_YAML_ROOT="$RUNNER_TEMP/st-lan-yaml" node scripts/test-lan-security.cjs
          bash -n app/src/main/assets/server-config.sh
          ST_TEST_YAML_ROOT="$RUNNER_TEMP/st-lan-yaml" node scripts/test-server-config.cjs
          node scripts/test-extensions.cjs
          node scripts/test-share-character.cjs
          node scripts/test-selective-restore.cjs
          bash scripts/test-selective-restore-journal.sh
          node scripts/test-version-state.cjs
          bash scripts/test-version-flow.sh

      - name: Test manager safety helpers
        run: |
          bash scripts/test-manager.sh
          bash scripts/test-manager-storage.sh
          bash scripts/test-backup-metadata.sh
          bash scripts/test-safety-manager-wiring.sh
          node scripts/test-safety-inventory.cjs
          node scripts/test-safety-completion.cjs
          bash scripts/test-manager-files.sh
          node scripts/test-file-preview.cjs
          bash scripts/test-node-package-info.sh
          node scripts/test-storage-usage.cjs
          node scripts/test-backup-catalog.cjs
          node scripts/test-chat-integrity.cjs
          bash scripts/test-chat-manager.sh
          bash scripts/test-manager-progress.sh
          bash scripts/test-progress.sh
          bash scripts/test-archive-progress.sh
          bash scripts/test-progress-checks.sh
          bash scripts/test-safe-backup.sh
          bash scripts/test-update-changelog.sh

      - name: Repeat isolated backup, import, recovery and cancellation simulations
        run: |
          for pass in 1 2; do
            echo "Safety simulation pass $pass"
            bash scripts/test-import-normalization.sh
            bash scripts/test-import-ambiguous-native.sh
            bash scripts/test-install-validation.sh
            bash scripts/test-install-prerequisites.sh
            bash scripts/test-install-ownership.sh
            bash scripts/test-repair-runtime.sh
            bash scripts/test-archive-prerequisites.sh
            bash scripts/test-safety-storage.sh
            bash scripts/test-safety-manager.sh
            bash scripts/test-transaction-recovery.sh
            bash scripts/test-transaction-termux-parent.sh
            bash scripts/test-backup-surface.sh
            bash scripts/test-progress-hardlinks.sh
            bash scripts/test-restore-recovery.sh
            bash scripts/test-restore-work-collision.sh
            bash scripts/test-backup-create.sh
            bash scripts/test-operation-cancel.sh
            bash scripts/test-backup-cancel.sh
          done

      - name: Test, lint, and build debug and unsigned release APKs
        run: ./gradlew --no-daemon test lint assembleDebug assembleRelease

      - name: Verify APK identities and versions
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
            echo "$badging"
            grep -F "versionCode='5'" <<< "$badging"
            if [[ "$apk" == */release/* ]]; then
              grep -F "package: name='app.tavernbridge.stlauncher'" <<< "$badging"
              grep -F "versionName='0.3.2'" <<< "$badging"
              if grep -q 'application-debuggable' <<< "$badging"; then
                echo 'Production APK must not be debuggable' >&2
                exit 1
              fi
            else
              grep -F "package: name='app.tavernbridge.stlauncher.debug'" <<< "$badging"
              grep -F "versionName='0.3.2-dev'" <<< "$badging"
            fi
          done

      - name: Upload unsigned release APK (build validation only, not installable)
        uses: actions/upload-artifact@v6
        with:
          name: st-launcher-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
