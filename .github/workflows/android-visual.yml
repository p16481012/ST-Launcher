name: Android visual verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    name: Native UI · ${{ matrix.form }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - form: phone
            pixels: 720x1520
          - form: tablet
            pixels: 2048x1280
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Build debug visual tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Start isolated Android emulator
        env:
          PIXELS: ${{ matrix.pixels }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          image='system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$image" emulator platform-tools
          adb version
          # avdmanager and emulator can otherwise use different home directories on hosted runners.
          export ANDROID_USER_HOME="$RUNNER_TEMP/v2-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avd="$ANDROID_AVD_HOME/v2test.avd"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n v2test -k "$image" -d pixel_6 --force --path "$avd"
          test -s "$avd/config.ini"
          # Some CLI versions place the small name→directory index outside ANDROID_AVD_HOME.
          if [[ ! -s "$ANDROID_AVD_HOME/v2test.ini" ]]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$avd" > "$ANDROID_AVD_HOME/v2test.ini"
          fi
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx v2test
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd v2test -port 5554 -gpu software -no-window -no-audio -no-snapshot -no-boot-anim > "$RUNNER_TEMP/emulator.log" 2>&1 </dev/null &
          pid=$!
          for _ in {1..60}; do
            kill -0 "$pid" || { tail -n 40 "$RUNNER_TEMP/emulator.log"; exit 1; }
            if adb devices | grep -q 'emulator-5554'; then break; fi
            sleep 2
          done
          timeout 60 adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb shell wm size "$PIXELS"
          adb shell wm density 320
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          adb shell wm dismiss-keyguard
      - name: Run native Compose assertions
        run: |
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          mkdir -p visual-results
          adb shell am instrument -w -r -e package app.tavernbridge.launcher.ui app.tavernbridge.stlauncher.debug.test/androidx.test.runner.AndroidJUnitRunner | tee visual-results/instrumentation.txt
          grep -Eq '^OK \([1-9][0-9]* tests?\)' visual-results/instrumentation.txt
          for required in selectingAnArchiveNeverStopsServerOrReplacesPhoneFiles hubNeverRunsDeepChecksAndOrphanTrashNeedsSelectionAndConfirmation hubHasSeparateAssetKindsAndOnlyOpensTheChosenList cardSortAppliesWithoutReadingTheListAgain backgroundsShareARowAndOpenTheUncroppedDetail; do
            grep -Fq "test=$required" visual-results/instrumentation.txt
          done
          for required in jsonAssetsPreviewOnlyWhenOpenedAndNeverExecuteTheirContents usedBackgroundIsNotMovedAndOpeningItsMenuDoesNotStartAnOperation unknownReferencesDefaultToCopyAndRequireConsentToTrashOrRenameOriginal; do
            grep -Fq "test=$required" visual-results/instrumentation.txt
          done
          for required in cardTapShowsUncroppedArtAndMetadataWithoutOpeningActions cardRenameOnlyChangesUnlinkedCardsAndOffersCopyOtherwise cardTrashDefaultsToCardOnlyAndProtectedCardExplainsWhy; do
            grep -Fq "test=$required" visual-results/instrumentation.txt
          done
          for required in installedManagementActionsAreRealDestinationsAndBackReturnsToTheirOrigin homeLogReturnsHomeAndToolsLogReturnsTools briefReadNeverFlashesAndLongReadShowsUntilCompletion tapOnlyHandleFoldsAndMiniBarReopens runningServerAllowsOpeningAndSavingFromLabelAfterAcknowledgement onlyVerifiedStopOpensOriginalConfirmationOnce leavingSelectedArchiveDropsEvenSuccessfulInFlightStop; do
            grep -Fq "test=$required" visual-results/instrumentation.txt
          done
      - name: Verify Android backup scheduling and notification delivery
        run: |
          adb shell pm grant app.tavernbridge.stlauncher.debug android.permission.POST_NOTIFICATIONS
          adb shell am instrument -w -r -e class app.tavernbridge.launcher.automation.BackupWorkerSmokeTest app.tavernbridge.stlauncher.debug.test/androidx.test.runner.AndroidJUnitRunner | tee visual-results/backup-work.txt
          grep -Eq '^OK \([1-9][0-9]* tests?\)' visual-results/backup-work.txt
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p visual-results
          if [[ -f "$RUNNER_TEMP/emulator.log" ]]; then cp "$RUNNER_TEMP/emulator.log" visual-results/emulator.log; fi
          if adb get-state 2>/dev/null | grep -q device; then
            names=(action-affordances review-display-small review-display-sheet review-diagnostic-empty review-diagnostic-result review-diagnostic-solution review-safety-list review-safety-actions review-safety-delete review-safety-selection review-safety-locked home home-install-check setup-step-3 settings-index settings-display modal-confirm modal-long modal-backup modal-info modal-app-management files-browser files-trash repair-runtime-consent tool-installation management-update management-backup)
            for screen in home settings backups; do for mode in light dark; do for contrast in normal high; do for accent in amber green wine slate blue violet; do
              names+=("palette-$screen-$mode-$contrast-$accent")
            done; done; done; done
            for name in "${names[@]}"; do
              path="files/v2-visual/$name.png"
              if adb shell run-as app.tavernbridge.stlauncher.debug ls "$path" >/dev/null 2>&1; then
                adb exec-out run-as app.tavernbridge.stlauncher.debug cat "$path" > "visual-results/$name.png"
              fi
            done
            adb exec-out run-as app.tavernbridge.stlauncher.debug cat files/v2-visual/modal-geometry.tsv > visual-results/modal-geometry.tsv
          fi
      - name: Verify PNG capture set
        env:
          FORM: ${{ matrix.form }}
        run: |
          expected=(action-affordances review-display-small review-display-sheet review-diagnostic-empty review-diagnostic-result review-diagnostic-solution review-safety-list review-safety-actions review-safety-delete review-safety-selection review-safety-locked home setup-step-3 settings-display modal-confirm modal-long modal-backup modal-info modal-app-management files-browser files-trash tool-installation management-update management-backup)
          if [[ "$FORM" == phone ]]; then expected+=(settings-index); fi
          for name in "${expected[@]}"; do
            test -s "visual-results/$name.png"
            file "visual-results/$name.png" | grep -q 'PNG image data'
          done
          if ! python -c 'from PIL import Image' 2>/dev/null; then python -m pip install Pillow; fi
          python scripts/check_visual_matrix.py visual-results
          python scripts/grayscale_action_previews.py visual-results
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-v2-${{ matrix.form }}
          path: visual-results/
          retention-days: 14
