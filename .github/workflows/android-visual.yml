name: Android visual verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    name: Native UI · ${{ matrix.form }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - form: phone
            pixels: 720x1520
          - form: tablet
            pixels: 2048x1280
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Build debug visual tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Start isolated Android emulator
        env:
          PIXELS: ${{ matrix.pixels }}
        run: |
          set -euo pipefail
          image='system-images;android-35;google_apis;x86_64'
          sdkmanager "$image" emulator platform-tools
          echo no | avdmanager create avd -n v2test -k "$image" -d pixel_6 --force
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd v2test -port 5554 -gpu swiftshader_indirect -no-window -no-audio -no-snapshot -no-boot-anim > "$RUNNER_TEMP/emulator.log" 2>&1 </dev/null &
          timeout 180 adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb shell wm size "$PIXELS"
          adb shell wm density 320
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
      - name: Run native Compose assertions
        run: |
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          mkdir -p visual-results
          adb shell am instrument -w -r -e class app.tavernbridge.launcher.ui.V2VisualTest app.tavernbridge.stlauncher.debug.test/androidx.test.runner.AndroidJUnitRunner | tee visual-results/instrumentation.txt
          grep -q 'OK (3 tests)' visual-results/instrumentation.txt
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p visual-results
          if adb get-state 2>/dev/null | grep -q device; then
            for name in home setup-step-3 settings-index settings-display; do
              path="files/v2-visual/$name.png"
              if adb shell run-as app.tavernbridge.stlauncher.debug test -f "$path"; then
                adb exec-out run-as app.tavernbridge.stlauncher.debug cat "$path" > "visual-results/$name.png"
              fi
            done
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-v2-${{ matrix.form }}
          path: visual-results/
          retention-days: 14
